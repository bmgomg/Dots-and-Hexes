<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- graph paper; a blue hex, an orange hex, and an open one a single move from closing -->
	<defs>
		<pattern id="g" width="8" height="8" patternUnits="userSpaceOnUse">
			<path d="M8 0V8M0 8H8" fill="none" stroke="#c3d6b3" stroke-width=".8" />
		</pattern>
		<pattern id="b" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
			<rect width="3.5" height="3.5" fill="#2a63c4" fill-opacity=".3" />
			<path d="M0 0V3.5" stroke="#2a63c4" stroke-width="1.5" />
		</pattern>
		<pattern id="o" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
			<rect width="3.5" height="3.5" fill="#e07a1f" fill-opacity=".3" />
			<path d="M0 0V3.5" stroke="#e07a1f" stroke-width="1.5" />
		</pattern>
	</defs>
	<rect width="64" height="64" rx="12" fill="#f1f5ea" />
	<rect width="64" height="64" rx="12" fill="url(#g)" />
	<polygon points="21.61,11 32,17 32,29 21.61,35 11.22,29 11.22,17" fill="url(#b)" />
	<polygon points="42.39,11 52.78,17 52.78,29 42.39,35 32,29 32,17" fill="url(#o)" />
	<g fill="none" stroke="#3a3a40" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
		<polygon points="21.61,11 32,17 32,29 21.61,35 11.22,29 11.22,17" />
		<polygon points="42.39,11 52.78,17 52.78,29 42.39,35 32,29 32,17" />
		<path d="M21.61 47V35L32 29L42.39 35V47" />
	</g>
	<!-- the move that closes it, previewed as in the game -->
	<path d="M21.61 47L32 53L42.39 47" fill="none" stroke="#5b5b62" stroke-width="1.8" stroke-dasharray="3.2 3.4" stroke-linecap="round" />

	<g fill="#2f2f34">
		<circle cx="21.61" cy="11" r="2.3" /><circle cx="32" cy="17" r="2.3" /><circle cx="32" cy="29" r="2.3" />
		<circle cx="21.61" cy="35" r="2.3" /><circle cx="11.22" cy="29" r="2.3" /><circle cx="11.22" cy="17" r="2.3" />
		<circle cx="42.39" cy="11" r="2.3" /><circle cx="52.78" cy="17" r="2.3" /><circle cx="52.78" cy="29" r="2.3" />
		<circle cx="42.39" cy="35" r="2.3" /><circle cx="42.39" cy="47" r="2.3" /><circle cx="32" cy="53" r="2.3" />
		<circle cx="21.61" cy="47" r="2.3" />
	</g>
</svg>
