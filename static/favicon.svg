<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- graph paper; one hex, half blue and half orange: the two players -->
	<defs>
		<pattern id="g" width="8" height="8" patternUnits="userSpaceOnUse">
			<path d="M8 0V8M0 8H8" fill="none" stroke="#c3d6b3" stroke-width=".8" />
		</pattern>
		<pattern id="b" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
			<rect width="3.6" height="3.6" fill="#2a63c4" fill-opacity=".3" />
			<path d="M0 0V3.6" stroke="#2a63c4" stroke-width="1.6" />
		</pattern>
		<pattern id="o" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
			<rect width="3.6" height="3.6" fill="#e07a1f" fill-opacity=".3" />
			<path d="M0 0V3.6" stroke="#e07a1f" stroke-width="1.6" />
		</pattern>
	</defs>
	<rect width="64" height="64" rx="12" fill="#f1f5ea" />
	<rect width="64" height="64" rx="12" fill="url(#g)" />
	<polygon points="32.00,5.00 8.62,18.50 8.62,45.50 32.00,59.00" fill="url(#b)" />
	<polygon points="32.00,5.00 55.38,18.50 55.38,45.50 32.00,59.00" fill="url(#o)" />
	<line x1="32.00" y1="5.00" x2="32.00" y2="59.00" stroke="#2f2f34" stroke-width="2.20" stroke-dasharray="3.00 3.00" />
	<polygon points="55.38,18.50 55.38,45.50 32.00,59.00 8.62,45.50 8.62,18.50 32.00,5.00" fill="none" stroke="#2f2f34" stroke-width="3.00" stroke-linejoin="round" />
	<g fill="#2f2f34">
		<circle cx="55.38" cy="18.50" r="3.20" />
		<circle cx="55.38" cy="45.50" r="3.20" />
		<circle cx="32.00" cy="59.00" r="3.20" />
		<circle cx="8.62" cy="45.50" r="3.20" />
		<circle cx="8.62" cy="18.50" r="3.20" />
		<circle cx="32.00" cy="5.00" r="3.20" />
	</g>
</svg>
