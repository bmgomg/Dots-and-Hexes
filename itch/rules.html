<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Dots and Hexes rules</title>
		<!-- The home page's rules, for the itch.io description: styled as in src/Home.svelte, on the graph pad.
	     render.sh renders it at the size of .canvas (450×440) -->
		<link rel="stylesheet" href="common.css" />
		<style>
			.canvas {
				position: relative;
				box-sizing: border-box;
				width: 450px;
				height: 440px;
				display: grid;
				place-content: center;
			}

			.content {
				position: relative;
				width: 400px;
				display: grid;
				gap: 20px;
			}

			.intro {
				justify-self: center;
				font-size: 21px;
			}

			.bullets {
				display: grid;
				gap: 10px;
			}

			.item {
				display: grid;
				grid: auto / 13px 1fr;
				gap: 11px;
			}

			.bullet {
				width: 13px;
				height: 13px;
				margin-top: 8px;
				fill: var(--p1);
				opacity: 0.75;
			}

			.bullet.odd {
				fill: var(--p2);
				opacity: 0.85;
			}

			.text {
				font-size: 19px;
				line-height: 27px;
			}
		</style>
	</head>

	<body>
		<div class="canvas">
			<div class="pad">
				<svg class="grain"><rect width="100%" height="100%" filter="url(#grain)" /></svg>
			</div>
			<div class="content">
				<div class="intro">Draw two. <span class="hl">Close a hex. Go again.</span></div>
				<div class="bullets"></div>
			</div>
		</div>

		<script type="module">
			import { addDefs } from './board.js';

			addDefs();

			// as on Home; the hexagon bullets alternate blue and orange
			const RULES = [
				'Take turns <span class="hl">tapping two dots</span> two steps apart. Both lines between them get drawn.',
				'After the opening move, the path must <span class="hl">touch an existing line</span>, at either end or in the&nbsp;middle.',
				'Close a hex to claim it, then <span class="hl">move again</span>.',
				'When no two-line move is left, draw <span class="hl">one line at a time</span>. Then you move again only if your line closes two hexes at once.',
				'When every line is drawn, the <span class="hl">most hexes</span>&nbsp;win.'
			];

			document.querySelector('.bullets').innerHTML = RULES.map(
				(text, i) => `<div class="item">
				<svg class="bullet${i % 2 ? ' odd' : ''}" viewBox="0 0 12 12"><polygon points="10.3,3.5 10.3,8.5 6,11 1.7,8.5 1.7,3.5 6,1" /></svg>
				<div class="text">${text}</div>
			</div>`
			).join('');
		</script>
	</body>
</html>
