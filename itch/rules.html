<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Dots and Hexes rules</title>
		<!-- The home page's rules, for the itch.io description: styled as in src/Home.svelte, on the graph pad.
	     render.sh renders it at the size of .canvas (450×390).
	     #taped: the same sheet, a little askew, stuck down with two strips of clear tape across its top corners,
	     on the game's walnut desk (rendered at 500×450) -->
		<link rel="stylesheet" href="common.css" />
		<style>
			.canvas {
				position: relative;
				box-sizing: border-box;
				width: 450px;
				height: 390px;
				display: grid;
				place-content: center;
			}

			.content {
				position: relative;
				width: 400px;
				display: grid;
				gap: 20px;
			}

			.bullets {
				display: grid;
				gap: 10px;
			}

			.item {
				display: grid;
				grid: auto / 13px 1fr;
				gap: 11px;
			}

			/* #taped */
			body.taped {
				width: 500px;
				height: 450px;
				background: var(--desk);
				display: grid;
				place-content: center;
			}

			/* the walnut desk, as in src/routes/+page.svelte */
			.desk {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
			}

			.taped .canvas {
				rotate: -1.2deg;
				box-shadow:
					0 1px 1px #00000014,
					0 10px 18px -8px #1e321460;
			}

			/* clear tape: a faint gray film with a sheen along it, edges that catch the light, torn ends */
			.tape {
				position: absolute;
				width: 104px;
				height: 30px;
				background: linear-gradient(
					180deg,
					rgba(250, 250, 244, 0.62),
					rgba(222, 222, 214, 0.34) 30%,
					rgba(214, 214, 205, 0.3) 70%,
					rgba(245, 245, 238, 0.55)
				);
				border-block: 1px solid rgba(140, 140, 130, 0.35);
				box-shadow:
					inset 0 1px 0 rgba(255, 255, 255, 0.7),
					0 1px 2px rgba(0, 0, 0, 0.12);
			}

			.bullet {
				width: 13px;
				height: 13px;
				margin-top: 8px;
				fill: var(--p1);
				opacity: 0.75;
			}

			.bullet.odd {
				fill: var(--p2);
				opacity: 0.85;
			}

			.text {
				font-size: 19px;
				line-height: 27px;
			}
		</style>
	</head>

	<body>
		<div class="canvas">
			<div class="pad">
				<svg class="grain"><rect width="100%" height="100%" filter="url(#grain)" /></svg>
			</div>
			<div class="content">
				<div class="bullets"></div>
			</div>
		</div>

		<script type="module">
			import { addDefs } from './board.js';

			addDefs();

			if (location.hash === '#taped') {
				document.body.classList.add('taped');
				document.body.insertAdjacentHTML('afterbegin', '<svg class="desk"><rect width="100%" height="100%" filter="url(#wood)" /></svg>');
				const canvas = document.querySelector('.canvas');

				// torn ends: small zigzags across each short side
				const teeth = 6;
				const end = (x, dir) =>
					Array.from({ length: teeth * 2 + 1 }, (_, i) => `${x + (i % 2 ? dir * 3 : 0)}px ${(i * 100) / (teeth * 2)}%`);
				const clip = `polygon(${[...end(0, 1), ...end(104, -1).reverse()].join(', ')})`;

				// centered on the two top corners, half on the sheet and half off
				for (const [left, angle] of [
					[-34, -38],
					[380, 38]
				]) {
					const tape = document.createElement('div');
					tape.className = 'tape';
					Object.assign(tape.style, { left: left + 'px', top: '4px', rotate: angle + 'deg', clipPath: clip });
					canvas.appendChild(tape);
				}
			}

			// as on Home; the hexagon bullets alternate blue and orange
			const RULES = [
				'Take turns <span class="hl">tapping two dots</span> two steps apart. Both lines between them get drawn.',
				'After the opening move, the path must <span class="hl">touch an existing line</span>, at either end or in the&nbsp;middle.',
				'Close a hex to claim it, then <span class="hl">move again</span>.',
				'When no two-line move is left, draw <span class="hl">one line at a time</span>. Then you move again only if your line closes two hexes at once.',
				'When every line is drawn, the <span class="hl">most hexes</span>&nbsp;win.'
			];

			document.querySelector('.bullets').innerHTML = RULES.map(
				(text, i) => `<div class="item">
				<svg class="bullet${i % 2 ? ' odd' : ''}" viewBox="0 0 12 12"><polygon points="10.3,3.5 10.3,8.5 6,11 1.7,8.5 1.7,3.5 6,1" /></svg>
				<div class="text">${text}</div>
			</div>`
			).join('');
		</script>
	</body>
</html>
